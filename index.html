<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Checkerboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body {
    margin: 0;
    background: #0a1a2f;
    display: flex;
    justify-content: center;
    font-family: Arial, sans-serif;
}

#scale-root {
    display: flex;
    justify-content: center;
    width: 100vw;
}

#container {
    margin-top: 40px;
    text-align: center;
    transform-origin: top center;
}

button, div { cursor: pointer; }

/* ---------- TOP BUTTONS ---------- */
#top-buttons {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
}

/* DEL button */
#delButton {
    width: 32px;
    height: 32px;
    margin-right: 8px;
    border-radius: 10px;
    border: 3px solid #222;
    background: #fff;
    box-shadow: 0 4px 0 #222;
    font-weight: bold;
    font-family: "Comic Sans MS", cursive;
    transition: transform 0.1s;
}

#delButton:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #222;
}

/* SMALL RED CIRCULAR BUTTON */
#cycleButton {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #ff3b3b;
    border: 2px solid #ff3b3b;
    box-shadow: 0 0 12px #ff3b3b;
    margin-right: 8px;
    transition: transform 0.1s, box-shadow 0.2s;
}

#cycleButton:active {
    transform: scale(0.95);
    box-shadow: 0 0 8px #ff3b3b;
}

/* Triangle buttons */
.triangle-btn {
    width: 38px;
    height: 38px;
    margin-right: 10px;
    border-radius: 10px;
    border: 3px solid #222;
    background: #fff;
    position: relative;
    box-shadow: 0 4px 0 #222;
    transition: transform 0.1s;
}

.triangle-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #222;
}

.triangle-btn svg {
    width: 100%;
    height: 100%;
}

#blueTriangle svg polygon {
    stroke: #0094ff;
    stroke-width: 4;
    fill: none;
}

#redTriangle svg polygon {
    stroke: #ff3b3b;
    stroke-width: 4;
    fill: none;
    stroke-dasharray: 8 4;
}

/* Highlight selected triangle */
.triangle-btn.selected {
    border-width: 4px;
    border-style: solid;
}

/* Original pattern buttons */
#top-buttons button {
    font-family: "Comic Sans MS", cursive;
    font-size: 20px;
    padding: 8px 18px;
    margin: 0 6px;
    border-radius: 14px;
    border: 3px solid #222;
    background: linear-gradient(#ffffff, #eaeaea);
    box-shadow: 0 4px 0 #222;
}

#top-buttons button:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #222;
}

#top-buttons button.selected {
    background: linear-gradient(#ffd700, #ffcc00);
}

/* ---------- COLOR ROW ---------- */
#color-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 12px;
}

#color-row button {
    font-family: "Comic Sans MS", cursive;
    font-size: 16px;
    padding: 8px 16px;
    border-radius: 14px;
    border: 3px solid #222;
    background: linear-gradient(#ffffff, #eaeaea);
    box-shadow: 0 4px 0 #222;
}

.color-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 3px solid #0a1a2f;
}

.color-btn.selected {
    border-color: white;
}

/* ---------- BOARD + LABELS ---------- */
#board-wrapper {
    display: grid;
    grid-template-columns: 45px auto;
    grid-template-rows: auto 45px;
    justify-content: center;
}

#rank-labels {
    display: grid;
    grid-template-rows: repeat(8, 75px);
    color: white;
    font-family: "Comic Sans MS", cursive;
    font-size: 22px;
    align-items: center;
    justify-items: center;
}

#file-labels {
    grid-column: 2;
    display: grid;
    grid-template-columns: repeat(8, 75px);
    color: white;
    font-family: "Comic Sans MS", cursive;
    font-size: 22px;
    align-items: center;
    justify-items: center;
}
/* ---------- BOARD ---------- */
#board {
    display: grid;
    grid-template-columns: repeat(8, 75px);
    grid-template-rows: repeat(8, 75px);
}

.square {
    width: 75px;
    height: 75px;
    border: 1px solid #222; /* thinner border */
    position: relative;
    user-select: none;
    touch-action: none;
    box-sizing: border-box;
}

.white { background: #eeeed2; }
.black { background: #769656; }

.letter {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Comic Sans MS", "Segoe Script", "Bradley Hand", cursive;
    font-size: 26px;
    color: red; /* letters on board are red */
    pointer-events: none;
    z-index: 3;
}

.square.editing .letter {
    visibility: hidden;
}

.highlight {
    position: absolute;
    inset: 0;
    opacity: 0.45;
    z-index: 2;
}

.edit-input {
    position: absolute;
    inset: 0;
    z-index: 5;
    font-family: "Comic Sans MS", "Segoe Script", "Bradley Hand", cursive;
    font-size: 26px;
    text-align: center;
    border: none;
    outline: none;
    background: transparent;
    color: white;
}

/* ---------- VISITORS ONLINE ---------- */
#visitors-online {
    margin-top: 12px;
    color: white;
    font-family: "Comic Sans MS", cursive;
    font-size: 20px;
    transform: translateX(28px);
}

/* Result display above blue and red triangles (editable) */
#blue-result, #red-result {
    position: absolute;
    top: -40px;
    left: 0;
    width: 100%;
    text-align: center;
    font-family: "Comic Sans MS", cursive;
    font-size: 22px;
    color: white;
    cursor: text; /* allow editing */
}
</style>
</head>
<body>
<div id="scale-root">
<div id="container">

<div id="top-buttons">
    <!-- DEL BUTTON -->
    <div id="delButton" onclick="eraseTriangleLetters()">Del</div>

    <!-- BLUE TRIANGLE BUTTON -->
    <div class="triangle-btn" id="blueTriangle" onclick="startTriangleMode('blue')">
        <svg viewBox="0 0 100 100">
            <polygon points="10,90 50,10 90,90"/>
        </svg>
        <div id="blue-result" ondblclick="editTriangleLetter('blue')">C</div>
    </div>

    <!-- RED TRIANGLE BUTTON -->
    <div class="triangle-btn" id="redTriangle" onclick="startTriangleMode('red')">
        <svg viewBox="0 0 100 100">
            <polygon points="10,90 50,10 90,90"/>
        </svg>
        <div id="red-result" ondblclick="editTriangleLetter('red')">C</div>
    </div>

    <!-- SMALL RED CIRCULAR BUTTON -->
    <div id="cycleButton" onclick="cycleTriangleLetters()"></div>

    <!-- ORIGINAL BUTTONS -->
    <button onclick="selectPattern('C')" id="btnC">C</button>
    <button onclick="selectPattern('R')" id="btnR">R</button>
    <button onclick="selectPattern('T')" id="btnT">T</button>
</div>

<div id="color-row">
    <button onclick="undoEdits()">Undo</button>
    <div class="color-btn" style="background:#ff9999" onclick="setColor('#ff9999',this)"></div>
    <div class="color-btn" style="background:#cfa6ff" onclick="setColor('#cfa6ff',this)"></div>
    <div class="color-btn" style="background:#9fd6ff" onclick="setColor('#9fd6ff',this)"></div>
    <div class="color-btn selected" style="background:#ffd700" onclick="setColor('#ffd700',this)"></div>
    <div class="color-btn" style="background:#ffb347" onclick="setColor('#ffb347',this)"></div>
    <div class="color-btn" style="background:#9be29b" onclick="setColor('#9be29b',this)"></div>
    <button onclick="eraseHighlights()">Erase</button>
</div>

<div id="board-wrapper">
    <div id="rank-labels"></div>
    <div id="board"></div>
    <div id="file-labels"></div>
</div>

<div id="visitors-online">
    Visitors Online: <span id="visitor-count">0</span>
</div>
<script>
/* 🔥 Firebase */
firebase.initializeApp({
    apiKey: "AIzaSyAVK-7BaCNArXkeS5a9u9GPCxws7uQ0bxM",
    authDomain: "realtime-a67ce.firebaseapp.com",
    databaseURL: "https://realtime-a67ce-default-rtdb.firebaseio.com",
    projectId: "realtime-a67ce",
    storageBucket: "realtime-a67ce.firebasestorage.app",
    messagingSenderId: "898508234092",
    appId: "1:898508234092:web:307173ddc018db44466749"
});

const database = firebase.database();
const visitorsRef = database.ref("visitors");
const connectedRef = database.ref(".info/connected");

let deviceId = localStorage.getItem("deviceId");
if (!deviceId) {
    deviceId = "device_" + Math.random().toString(36).slice(2);
    localStorage.setItem("deviceId", deviceId);
}

const deviceRef = visitorsRef.child(deviceId);
const connectionsRef = deviceRef.child("connections");
connectedRef.on("value", snap => {
    if (snap.val() === true) {
        const conn = connectionsRef.push(true);
        conn.onDisconnect().remove();
    }
});

const visitorCountEl = document.getElementById("visitor-count");
visitorsRef.on("value", snap => {
    let count = 0;
    snap.forEach(d => {
        if (d.child("connections").numChildren() > 0) count++;
    });
    visitorCountEl.textContent = count;
});

/* ---------- BOARD PATTERNS ---------- */
const board = document.getElementById("board");
const rankLabels = document.getElementById("rank-labels");
const fileLabels = document.getElementById("file-labels");

const patterns = {
    C: Array(8).fill("TCRTCRTC".split("")),
    R: Array(8).fill("RTCRTCRT".split("")),
    T: Array(8).fill("CRTCRTCR".split(""))
};

let currentPattern = "C";
let editedLetters = {};
let highlights = {};
let currentColor = "#ffd700";

let lastTapTime = 0;
let lockedSquare = null;
const DOUBLE_DELAY = 350;

/* TRIANGLE MODE */
let triangleMode = false;
let firstSquare = null;
let triangleColor = null;
/* ---------- LABEL CREATION ---------- */
for (let i = 8; i >= 1; i--) {
    const d = document.createElement("div");
    d.textContent = i;
    d.style.color = "white";
    rankLabels.appendChild(d);
}

"abcdefgh".split("").forEach(l => {
    const d = document.createElement("div");
    d.textContent = l;
    d.style.color = "white";
    fileLabels.appendChild(d);
});

/* ---------- CONTROL BUTTON LOGIC ---------- */
function selectPattern(p) {
    currentPattern = p;
    document.querySelectorAll("#top-buttons button").forEach(b => b.classList.remove("selected"));
    document.getElementById("btn"+p).classList.add("selected");
    drawLetters();
}

function setColor(color, el) {
    currentColor = color;
    document.querySelectorAll(".color-btn").forEach(c => c.classList.remove("selected"));
    el.classList.add("selected");
}

function undoEdits() {
    editedLetters = {};
    drawLetters();
}

function eraseHighlights() {
    Object.values(highlights).forEach(h => h.remove());
    highlights = {};
}

/* ---------- DEL BUTTON FUNCTION ---------- */
function eraseTriangleLetters() {
    document.getElementById("blue-result").textContent = "";
    document.getElementById("red-result").textContent = "";

    const delBtn = document.getElementById("delButton");
    delBtn.style.transform = "translateY(3px)";
    setTimeout(() => delBtn.style.transform = "translateY(0px)", 150);
}

/* ---------- SMALL RED BUTTON FUNCTION ---------- */
function cycleTriangleLetters() {
    const blueEl = document.getElementById("blue-result");
    const redEl = document.getElementById("red-result");

    const sequence = ["C","R","T"];
    let blueLetter = blueEl.textContent || "C";
    let redLetter = redEl.textContent || "C";

    // Blue goes back 2
    let blueIndex = sequence.indexOf(blueLetter);
    blueIndex = (blueIndex - 2 + 3) % 3;
    blueEl.textContent = sequence[blueIndex];

    // Red goes forward 5
    let redIndex = sequence.indexOf(redLetter);
    redIndex = (redIndex + 5) % 3;
    redEl.textContent = sequence[redIndex];

    // Bouncy effect
    const btn = document.getElementById("cycleButton");
    btn.style.transform = "scale(0.95)";
    setTimeout(() => btn.style.transform = "scale(1)", 150);
}

/* ---------- EDIT TRIANGLE LETTERS ---------- */
function editTriangleLetter(which) {
    const el = document.getElementById(which + "-result");
    const current = el.textContent || "";
    const input = document.createElement("input");
    input.value = current;
    input.className = "edit-input";
    input.style.fontSize = "22px";
    input.style.color = "white";
    input.style.textAlign = "center";
    input.style.width = "100%";
    el.innerHTML = "";
    el.appendChild(input);
    input.focus();

    input.addEventListener("blur", () => {
        el.textContent = input.value || "C";
    });

    input.addEventListener("keydown", e => {
        if (e.key === "Enter") {
            el.textContent = input.value || "C";
        }
    });
}

/* ---------- TRIANGLE MODE START ---------- */
function startTriangleMode(which) {
    triangleMode = true;
    firstSquare = null;
    triangleColor = which;

    document.getElementById("blueTriangle").classList.remove("selected");
    document.getElementById("redTriangle").classList.remove("selected");
    document.getElementById("blueTriangle").style.borderColor = "";
    document.getElementById("redTriangle").style.borderColor = "";

    if (which === "blue") {
        const btn = document.getElementById("blueTriangle");
        btn.classList.add("selected");
        btn.style.borderColor = "#0094ff";
    }
    if (which === "red") {
        const btn = document.getElementById("redTriangle");
        btn.classList.add("selected");
        btn.style.borderColor = "#ff3b3b";
    }

    const btn = document.getElementById(which + "Triangle");
    btn.style.transform = "translateY(3px)";
    setTimeout(() => btn.style.transform = "translateY(0px)", 150);
}

/* ---------- BOARD CREATION ---------- */
function drawBoard() {
    board.innerHTML = "";
    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            const sq = document.createElement("div");
            sq.className = "square " + ((r+c)%2===0 ? "white":"black");
            sq.dataset.key = r+","+c;
            sq.style.border = "1px solid #222";

            sq.addEventListener("pointerdown", e => handleTap(e, sq));

            const letter = document.createElement("div");
            letter.className = "letter";
            letter.style.fontFamily = '"Comic Sans MS","Segoe Script","Bradley Hand",cursive';
            letter.style.fontSize = "26px";
            sq.appendChild(letter);

            board.appendChild(sq);
        }
    }
    drawLetters();
}

function drawLetters() {
    document.querySelectorAll(".square").forEach(sq => {
        const key = sq.dataset.key;
        const [r, c] = key.split(",");
        sq.querySelector(".letter").textContent =
            editedLetters[key] ?? patterns[currentPattern][r][c];
    });
}

/* ---------- HANDLE TAP / DOUBLE TAP ---------- */
function handleTap(e, sq) {
    e.preventDefault();
    e.stopPropagation();

    if (triangleMode) {
        handleTriangleTap(sq);
        return;
    }

    const now = Date.now();
    const isDouble = sq === lockedSquare && (now - lastTapTime) < DOUBLE_DELAY;

    lastTapTime = now;
    lockedSquare = sq;

    if (isDouble) {
        editSquare(sq);
        return;
    }
    toggleHighlight(sq);
}

/* ---------- TRIANGLE LOGIC ---------- */
function handleTriangleTap(sq) {
    const key = sq.dataset.key;
    const [r, c] = key.split(",").map(Number);

    if (!firstSquare) {
        firstSquare = { r, c, key };
        highlightTriangleSquare(sq);
        return;
    }

    const secondSquare = { r, c };
    highlightTriangleSquare(sq);
    highlightTriangleSquare(document.querySelector(`[data-key='${firstSquare.key}']`));

    processTriangleCount(firstSquare, secondSquare);

    triangleMode = false;
    firstSquare = null;

    const triangleEl = document.getElementById(triangleColor + "Triangle");
    if(triangleEl) triangleEl.classList.add("selected");
}
/* ---------- HIGHLIGHT TRIANGLE SQUARES ---------- */
function highlightTriangleSquare(sq) {
    if (!sq) return;
    const key = sq.dataset.key;
    if (highlights[key]) highlights[key].remove();
    const h = document.createElement("div");
    h.className = "highlight";
    h.style.background = "#ffb6c1";
    h.style.opacity = "0.45";
    sq.appendChild(h);
    highlights[key] = h;
}

/* ---------- TRIANGLE COUNT LOGIC ---------- */
function processTriangleCount(first, second) {
    const resultEl = triangleColor === "blue" ? document.getElementById("blue-result") :
                     document.getElementById("red-result");

    const letter = editedLetters[first.key] ?? patterns[currentPattern][first.r][first.c];

    let cycle;
    if(letter === "C") cycle = ["C","T","R"];
    else if(letter === "R") cycle = ["T","R","C"];
    else if(letter === "T") cycle = ["R","C","T"];
    else cycle = ["C","T","R"];

    let index = cycle.indexOf(letter);
    let steps = 0;

    if (first.r === second.r) steps = Math.abs(second.c - first.c);
    else if (first.c === second.c) steps = Math.abs(second.r - first.r);
    else {
        resultEl.textContent = "X";
        return;
    }

    for(let i=0;i<steps;i++) index = (index+1)%3;

    resultEl.textContent = cycle[index];
}

/* ---------- TOGGLE HIGHLIGHT ---------- */
function toggleHighlight(sq) {
    const key = sq.dataset.key;
    if (highlights[key]) {
        highlights[key].remove();
        delete highlights[key];
    } else {
        const h = document.createElement("div");
        h.className = "highlight";
        h.style.background = currentColor;
        h.style.opacity = "0.45";
        sq.appendChild(h);
        highlights[key] = h;
    }
}

/* ---------- EDITING BOARD LETTERS ---------- */
function editSquare(sq) {
    if (sq.querySelector(".edit-input")) return;

    sq.classList.add("editing");

    const key = sq.dataset.key;
    const input = document.createElement("input");
    input.className = "edit-input";
    input.value = "";

    sq.appendChild(input);
    input.focus();

    input.addEventListener("keydown", e => {
        if(e.key==="Enter") {
            editedLetters[key] = input.value;
            cleanupEdit(sq, input);
        }
    });

    input.addEventListener("blur", () => {
        editedLetters[key] = input.value;
        cleanupEdit(sq, input);
    });
}

function cleanupEdit(sq, input) {
    input.remove();
    sq.classList.remove("editing");
    drawLetters();
}

/* ---------- RESPONSIVE SCALE ---------- */
function scaleToScreen() {
    const container = document.getElementById("container");
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const scale = Math.min(vw / 800, vh / 900, 1);
    container.style.transform = `scale(${scale})`;
}

window.addEventListener("resize", scaleToScreen);
window.addEventListener("orientationchange", scaleToScreen);

/* ---------- INITIALIZE ---------- */
drawBoard();
selectPattern("C");
scaleToScreen();

/* ---------- ENABLE TRIANGLE LETTER EDIT ON DOUBLE-CLICK ---------- */
document.getElementById("blue-result").addEventListener("dblclick", () => editTriangleLetter("blue"));
document.getElementById("red-result").addEventListener("dblclick", () => editTriangleLetter("red"));

/* ---------- EDIT TRIANGLE LETTERS ---------- */
function editTriangleLetter(color) {
    const el = document.getElementById(color + "-result");
    const current = el.textContent;
    const input = document.createElement("input");
    input.className = "edit-input";
    input.value = current;
    input.style.position = "absolute";
    input.style.top = "0";
    input.style.left = "0";
    input.style.width = "100%";
    input.style.height = "100%";
    input.style.fontSize = "22px";
    input.style.textAlign = "center";
    input.style.border = "none";
    input.style.outline = "none";
    input.style.background = "transparent";
    input.style.color = "white";

    el.textContent = "";
    el.appendChild(input);
    input.focus();

    input.addEventListener("keydown", e => {
        if(e.key === "Enter") {
            el.textContent = input.value;
        }
    });

    input.addEventListener("blur", () => {
        el.textContent = input.value;
    });
}
</script>
</div>
</body>
</html>
